name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic:
    name: Headless logic tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node test/logic.test.js
